[project]
name = "tokenguard-api"
version = "0.1.0"
description = "TokenGuard AI backend: gateway, usage ledger, safe cache, forecasting, anomaly detection, decision engine."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "fastembed>=0.9.0",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/ml/report.py" = ["E501"]  # markdown template strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
