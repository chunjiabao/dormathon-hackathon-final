services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tokenguard
      POSTGRES_PASSWORD: tokenguard
      POSTGRES_DB: tokenguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenguard"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
